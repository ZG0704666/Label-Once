[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolotrain-studio"
version = "1.0.0"
description = "Independent local YOLO annotation, training and evaluation studio"
requires-python = ">=3.10,<3.11"

[project.scripts]
yolotrain-studio = "studio.app:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
