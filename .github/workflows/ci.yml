name: Label Once CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # 测试使用假模型替身（tests/ 中的 FakeYOLO / sys.modules stub），
          # 不导入 ultralytics / torch / PyQt5，因此无需安装体积巨大的 ML 运行时。
          python -m pip install pytest numpy opencv-python Pillow PyYAML

      - name: Run Python tests
        run: python -m pytest -q

  python-lint:
    name: Python lint & types
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Keep the direct pins and the resolved lock in sync (stdlib-only, runs first).
      - name: Check lock sync
        run: python scripts/check_lock_sync.py

      # Ruff lint uses the project's own [tool.ruff] config in pyproject.toml.
      # The rule set is deliberately scoped (see the config comments) to flag
      # genuine correctness risk, not the codebase's intentional style.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: check .

      # Lenient mypy baseline (see [tool.mypy] in pyproject.toml): untyped bodies are
      # not analyzed yet; --no-site-packages keeps the gate portable across envs.
      - name: mypy (lenient baseline)
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy
          python -m mypy studio --no-site-packages

  dotnet-build:
    name: .NET build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        working-directory: desktop
        run: dotnet restore LabelOnce.sln

      - name: Build solution
        working-directory: desktop
        run: dotnet build LabelOnce.sln --configuration Release --no-restore

  dotnet-test:
    name: .NET unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # LabelOnce.Core.Tests holds the pure-logic unit tests (viewport/annotation) and runs
      # headless via dotnet test. LabelOnce.Desktop.Tests is an interactive WPF acceptance
      # harness (native SendInput, live backend, visible desktop) and is NOT runnable in CI;
      # it is exercised manually per docs/12-testing.md.
      - name: Run unit tests
        working-directory: desktop
        run: dotnet test LabelOnce.Core.Tests/LabelOnce.Core.Tests.csproj --configuration Release

  package-windows:
    name: Build WPF (release smoke)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - python-tests
      - python-lint
      - dotnet-build
      - dotnet-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # WPF-only artifact: proves the desktop build publishes and runs self-contained.
      # The shippable release (backend.exe + models/sam weights) is produced on a
      # machine with the labelonce conda env via desktop/scripts/build.ps1.
      - name: Publish desktop application
        run: >
          dotnet publish desktop/LabelOnce.Desktop/LabelOnce.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output Release/LabelOnce-wpf-win-x64

      - name: Create release archive
        run: Compress-Archive -Path Release/LabelOnce-wpf-win-x64/* -DestinationPath Release/LabelOnce-wpf-win-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelOnce-wpf-win-x64
          path: Release/LabelOnce-wpf-win-x64.zip
          if-no-files-found: error
