name: Label Once CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyQt5 numpy opencv-python Pillow PyYAML
          python -m pip install ultralytics==8.4.161

      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  dotnet-build:
    name: .NET build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        working-directory: desktop
        run: dotnet restore LabelOnce.sln

      - name: Build solution
        working-directory: desktop
        run: dotnet build LabelOnce.sln --configuration Release --no-restore

  package-windows:
    name: Package Windows release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - python-tests
      - dotnet-build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish desktop application
        run: >
          dotnet publish desktop/LabelOnce.Desktop/LabelOnce.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output Release/LabelOnce-win-x64

      - name: Create release archive
        run: Compress-Archive -Path Release/LabelOnce-win-x64/* -DestinationPath Release/LabelOnce-win-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelOnce-win-x64
          path: Release/LabelOnce-win-x64.zip
          if-no-files-found: error
